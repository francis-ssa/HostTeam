<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #0b1017;
      --bg-2: #141d2a;
      --surface: #121a26;
      --surface-strong: #1a2434;
      --panel: rgba(19, 27, 38, 0.9);
      --ink: #edf2f7;
      --muted: #c0ccdc;
      --accent: #e9b08d;
      --accent-strong: #f08e67;
      --shadow-dark: rgba(3, 6, 12, 0.6);
      --shadow-light: rgba(255, 255, 255, 0.04);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--ink);
    }

    .container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: linear-gradient(135deg, #0b1017 0%, #141d2a 100%);
      cursor: pointer;
      isolation: isolate;
    }

    .container::before {
      content: '';
      position: absolute;
      inset: 10% 12%;
      border-radius: 32px;
      background:
        radial-gradient(circle at 20% 25%, rgba(233, 176, 141, 0.2), transparent 30%),
        radial-gradient(circle at 80% 18%, rgba(131, 164, 255, 0.18), transparent 28%),
        radial-gradient(circle at 52% 82%, rgba(252, 214, 180, 0.14), transparent 32%);
      filter: blur(22px);
      animation: backgroundShift 8s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes backgroundShift {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.82; transform: scale(1.04); }
    }

    .loading-content {
      position: relative;
      z-index: 1;
      text-align: center;
      min-width: min(92vw, 420px);
      padding: 3rem 2.5rem;
      background: linear-gradient(145deg, rgba(18, 25, 35, 0.94), rgba(27, 36, 48, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      box-shadow:
        18px 18px 36px rgba(2, 5, 10, 0.5),
        -12px -12px 26px rgba(255, 255, 255, 0.03),
        inset 1px 1px 0 rgba(255, 255, 255, 0.04);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .loading-content:hover {
      transform: translateY(-3px);
      box-shadow:
        22px 22px 40px rgba(2, 5, 10, 0.58),
        -12px -12px 26px rgba(255, 255, 255, 0.04),
        inset 1px 1px 0 rgba(255, 255, 255, 0.04);
    }

    .spinner-wrapper {
      position: relative;
      margin-bottom: 2rem;
    }

    .modern-spinner {
      width: 84px;
      height: 84px;
      position: relative;
      margin: 0 auto;
    }

    .spinner-ring {
      position: absolute;
      inset: 0;
      border: 3px solid transparent;
      border-radius: 50%;
    }

    .ring-1 {
      border-top-color: rgba(109, 139, 246, 0.95);
      border-left-color: rgba(109, 139, 246, 0.38);
      animation: spin 1.5s linear infinite;
    }

    .ring-2 {
      inset: 7px;
      border-right-color: rgba(108, 123, 165, 0.75);
      border-bottom-color: rgba(108, 123, 165, 0.25);
      animation: spin 2s linear infinite reverse;
    }

    .ring-3 {
      inset: 16px;
      border-bottom-color: rgba(77, 103, 217, 0.7);
      border-left-color: rgba(77, 103, 217, 0.25);
      animation: spin 2.5s linear infinite;
    }

    .spinner-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7ea2ff, #4d67d9);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 18px rgba(109, 139, 246, 0.5);
      animation: corePulse 2s ease-in-out infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes corePulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.9;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 0.6;
      }
    }

    .loading-text {
      color: #f4f7fb;
      font-size: clamp(1.35rem, 2vw, 1.7rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      animation: textGlow 3s ease-in-out infinite;
    }

    .loading-subtitle {
      color: #d0d9e6;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      animation: subtitleFade 2s ease-in-out infinite alternate;
    }

    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 0 rgba(0,0,0,0); }
      50% { text-shadow: 0 0 16px rgba(109, 139, 246, 0.18); }
    }

    @keyframes subtitleFade {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .floating-particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(125, 145, 183, 0.55);
      box-shadow: 0 0 18px rgba(125, 145, 183, 0.2);
      animation: float 7s linear infinite;
    }

    .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; animation-delay: 1s; }
    .particle:nth-child(3) { left: 30%; animation-delay: 2s; }
    .particle:nth-child(4) { left: 40%; animation-delay: 3s; }
    .particle:nth-child(5) { left: 50%; animation-delay: 4s; }
    .particle:nth-child(6) { left: 60%; animation-delay: 5s; }
    .particle:nth-child(7) { left: 70%; animation-delay: 0.5s; }
    .particle:nth-child(8) { left: 80%; animation-delay: 1.5s; }
    .particle:nth-child(9) { left: 90%; animation-delay: 2.5s; }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0.4);
        opacity: 0;
      }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% {
        transform: translateY(-100px) scale(1);
        opacity: 0;
      }
    }

    .progress-bar {
      width: 200px;
      height: 4px;
      margin: 1.7rem auto 0;
      background: rgba(122, 130, 155, 0.18);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 3px 3px 8px rgba(157, 169, 188, 0.2), inset -3px -3px 8px rgba(255, 255, 255, 0.7);
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #bfd0ff 0%, #6d8bf6 50%, #bfd0ff 100%);
      animation: progress 2s ease-in-out infinite;
    }

    @keyframes progress {
      0% { transform: translateX(-22%); opacity: 0.7; }
      50% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(22%); opacity: 0.7; }
    }

    @media (max-width: 768px) {
      .loading-content {
        padding: 2.25rem 1.5rem;
        margin: 1rem;
      }

      .modern-spinner {
        width: 68px;
        height: 68px;
      }

      .loading-text {
        font-size: 1.25rem;
      }

      .loading-subtitle {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="container" onclick="window.location.href='october_main.html'" title="Click to continue">
    <div class="floating-particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    
    <div class="loading-content">
      <div class="spinner-wrapper">
        <div class="modern-spinner" role="status" aria-label="Loading">
          <div class="spinner-ring ring-1"></div>
          <div class="spinner-ring ring-2"></div>
          <div class="spinner-ring ring-3"></div>
          <div class="spinner-core"></div>
        </div>
      </div>
      
      <div class="loading-text">Loading Presentation..</div>
      <div class="loading-subtitle">Click anywhere to continue</div>
      
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>
</body>
</html>
